{% extends "base.html" %}

{% block title %}404 Not Found{% endblock %}

{% block content %}
<div style="max-width: 560px; margin: 4rem auto; text-align: center;">
  <div class="card" style="padding: 2.5rem 1.5rem;">
    <div style="font-size: 3.5rem; font-weight: 800; color: var(--primary); line-height: 1; margin-bottom: 1rem;">
      404
    </div>
    <h1 style="font-size: 1.5rem; font-weight: 700; color: var(--text-primary); margin-bottom: 0.75rem;">
      Resource Not Found
    </h1>
    <p style="color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 1.75rem; line-height: 1.6;">
      The document, report, or endpoint you requested could not be located. It may have been relocated, deleted, or never existed.
    </p>
    <div>
      <a href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('dashboard.landing') }}" class="btn btn-primary">
        Return to Dashboard
      </a>
      <a href="{{ url_for('documents.list_documents') if current_user.is_authenticated else url_for('auth.login') }}" class="btn btn-secondary" style="margin-left: 0.5rem;">
        Browse Documents
      </a>
    </div>
  </div>
</div>
{% endblock %}
